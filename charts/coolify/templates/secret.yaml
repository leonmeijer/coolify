{{- if not .Values.security.existingAppKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify.fullname" . }}-app
  labels:
    {{- include "coolify.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.security.appKey }}
  app-key: {{ .Values.security.appKey | b64enc | quote }}
  {{- else }}
  # Auto-generated APP_KEY - for production, set security.appKey in values
  app-key: {{ printf "base64:%s" (randAlphaNum 32 | b64enc) | b64enc | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify.fullname" . }}-pusher
  labels:
    {{- include "coolify.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.security.pusher.appId }}
  app-id: {{ .Values.security.pusher.appId | b64enc | quote }}
  {{- else }}
  app-id: {{ "coolify" | b64enc | quote }}
  {{- end }}
  {{- if .Values.security.pusher.appKey }}
  app-key: {{ .Values.security.pusher.appKey | b64enc | quote }}
  {{- else }}
  app-key: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
  {{- if .Values.security.pusher.appSecret }}
  app-secret: {{ .Values.security.pusher.appSecret | b64enc | quote }}
  {{- else }}
  app-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
---
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify.fullname" . }}-postgresql
  labels:
    {{- include "coolify.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.redis.enabled (not .Values.redis.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify.fullname" . }}-redis
  labels:
    {{- include "coolify.redis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.redis.auth.password }}
  password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
