# =============================================================================
# Coolify Helm Chart - OpenShift (Red Hat) Values
# =============================================================================
#
# This values file is configured for Red Hat OpenShift (OCP).
# For OKD (community version), see values-okd.yaml
#
# OpenShift has stricter security defaults than vanilla Kubernetes.
#
# Prerequisites:
# 1. Grant anyuid SCC to the service account
# 2. Ensure images can be pulled from ghcr.io (or mirror to internal registry)
#
# Installation:
#   # First, create project and grant SCC
#   oc new-project coolify
#   oc adm policy add-scc-to-user anyuid -z coolify -n coolify
#
#   # Optional: Allow pulling from ghcr.io
#   oc create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USERNAME \
#     --docker-password=YOUR_GITHUB_PAT \
#     -n coolify
#   oc secrets link coolify ghcr-secret --for=pull
#
#   # Install the chart
#   helm install coolify ./charts/coolify \
#     --namespace coolify \
#     -f charts/coolify/values-openshift.yaml
#
# =============================================================================

coolify:
  image:
    repository: ghcr.io/coollabsio/coolify
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    appName: "Coolify"
    # IMPORTANT: Update to your OpenShift apps domain
    appUrl: "https://coolify.apps.cluster.example.com"
    appEnv: "production"
    appDebug: false
    trustedProxies: "*"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

soketi:
  image:
    repository: ghcr.io/coollabsio/coolify-realtime
    tag: "1.0.10"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

postgresql:
  enabled: true

  image:
    # Option 1: Use upstream postgres (requires anyuid SCC)
    repository: postgres
    tag: "15-alpine"

    # Option 2: Use Red Hat certified image (more compatible with restricted SCC)
    # repository: registry.redhat.io/rhel8/postgresql-15
    # tag: "latest"

  persistence:
    enabled: true
    size: 10Gi
    # OpenShift storage classes vary by platform:
    # - AWS: gp2, gp3
    # - Azure: managed-premium, managed-standard
    # - vSphere: thin
    # - ODF/OCS: ocs-storagecluster-ceph-rbd
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"

    # Alternative: Red Hat certified image
    # repository: registry.redhat.io/rhel8/redis-6
    # tag: "latest"

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 80

# Disable Kubernetes Ingress - use OpenShift Route instead
ingress:
  enabled: false

# OpenShift Route configuration
route:
  enabled: true
  # IMPORTANT: Update to your OpenShift apps domain
  host: "coolify.apps.cluster.example.com"
  annotations:
    # Optional: HAProxy specific annotations
    # haproxy.router.openshift.io/timeout: 60s
    # haproxy.router.openshift.io/balance: roundrobin
  tls:
    enabled: true
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"
    # Optional: Custom certificate
    # certificate: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    # key: |
    #   -----BEGIN RSA PRIVATE KEY-----
    #   ...

soketiRoute:
  enabled: false

security:
  appKey: ""

  podSecurityContext:
    fsGroup: 82

  # For restricted SCC compatibility (if not using anyuid):
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  #   runAsNonRoot: true
  #   seccompProfile:
  #     type: RuntimeDefault

openshift:
  createSCC: false

serviceAccount:
  create: true
  name: "coolify"
  annotations: {}

# If images are in a private registry, add pull secret
imagePullSecrets: []
# - name: ghcr-secret
