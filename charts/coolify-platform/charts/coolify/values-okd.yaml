# =============================================================================
# Coolify Helm Chart - OKD/OpenShift Values
# =============================================================================
#
# This values file is configured for OKD/OpenShift deployment.
#
# Prerequisites:
# 1. Grant anyuid SCC to the service account (see below)
# 2. Ensure ghcr.io images can be pulled (or mirror to internal registry)
#
# Installation:
#   # First, create namespace and grant SCC
#   oc new-project coolify
#   oc adm policy add-scc-to-user anyuid -z coolify -n coolify
#
#   # Then install the chart
#   helm install coolify ./charts/coolify \
#     --namespace coolify \
#     -f charts/coolify/values-okd.yaml
#
# =============================================================================

# -- Coolify application settings
coolify:
  image:
    repository: ghcr.io/coollabsio/coolify
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    appName: "Coolify"
    # IMPORTANT: Update this to your actual OKD route URL
    appUrl: "https://coolify.apps.okd.lvm.local"
    appEnv: "production"
    appDebug: false
    trustedProxies: "*"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# -- Soketi (WebSocket) settings
soketi:
  image:
    repository: ghcr.io/coollabsio/coolify-realtime
    tag: "1.0.10"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- PostgreSQL settings
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: "coolify"
    username: "coolify"
    # Password will be auto-generated. For production, set explicitly:
    # password: "your-secure-password"

  persistence:
    enabled: true
    size: 10Gi
    # OKD typically uses these storage classes:
    # - "standard" (default)
    # - "gp2" (AWS)
    # - "managed-premium" (Azure)
    # - "ocs-storagecluster-ceph-rbd" (OCS/ODF)
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# -- Redis settings
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  auth:
    # Password will be auto-generated. For production, set explicitly:
    # password: "your-secure-password"

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- Persistent storage for Coolify data
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""

# -- Service settings
service:
  type: ClusterIP
  port: 80

# -- Disable Kubernetes Ingress (use OpenShift Route instead)
ingress:
  enabled: false

# -- OpenShift Route (preferred over Ingress on OKD)
route:
  enabled: true
  # IMPORTANT: Update this to your actual OKD apps domain
  host: "coolify.apps.okd.lvm.local"
  annotations: {}
  tls:
    enabled: true
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"

# -- Soketi Route (optional - for external WebSocket access)
# Usually not needed as Coolify connects to Soketi internally
soketiRoute:
  enabled: false
  host: "soketi.apps.okd.lvm.local"
  tls:
    enabled: true
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"

# -- Security settings
security:
  # IMPORTANT: For production, generate and set a static APP_KEY:
  #   head -c 32 /dev/urandom | base64
  # appKey: "base64:YOUR_KEY_HERE"
  appKey: ""

  # Pod security context - compatible with anyuid SCC
  podSecurityContext:
    fsGroup: 82

  # Container security context
  securityContext: {}

# -- OpenShift-specific settings
openshift:
  # Set to true if you have cluster-admin and want to create a custom SCC
  # Otherwise, use: oc adm policy add-scc-to-user anyuid -z coolify -n coolify
  createSCC: false

# -- Service account settings
serviceAccount:
  create: true
  name: "coolify"
  annotations: {}

# -- Image pull secrets (if using private registry)
# For ghcr.io, you may need to create a pull secret:
#   oc create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USERNAME \
#     --docker-password=YOUR_GITHUB_PAT
imagePullSecrets: []
# - name: ghcr-pull-secret
