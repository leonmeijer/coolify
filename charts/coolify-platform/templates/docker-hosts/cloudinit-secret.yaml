{{- if .Values.dockerHosts.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify-platform.cloudInitSecretName" . }}
  namespace: {{ include "coolify-platform.vmNamespace" . }}
  labels:
    {{- include "coolify-platform.dockerHost.labels" . | nindent 4 }}
type: Opaque
stringData:
  userdata: |
    #cloud-config
    users:
      - name: {{ .Values.dockerHosts.ssh.username }}
        groups: [docker, sudo, adm]
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        lock_passwd: true
        ssh_authorized_keys:
          {{- if .Values.dockerHosts.ssh.authorizedKeys }}
          {{- range .Values.dockerHosts.ssh.authorizedKeys }}
          - {{ . | quote }}
          {{- end }}
          {{- else }}
          - SSH_PUBLIC_KEY_PLACEHOLDER
          {{- end }}

    packages:
    {{- range .Values.dockerHosts.cloudInit.packages }}
      - {{ . }}
    {{- end }}

    package_update: true
    package_upgrade: true

    write_files:
      - path: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "storage-driver": "overlay2"
          }
        permissions: '0644'

    runcmd:
      # Add Docker repository for Fedora/RHEL
      - dnf -y install dnf-plugins-core || true
      - dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo || true
      # Install Docker if not already installed via packages
      - dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin || true
      - systemctl enable docker
      - systemctl start docker
      - usermod -aG docker {{ .Values.dockerHosts.ssh.username }}
      - systemctl restart docker
      {{- range .Values.dockerHosts.cloudInit.runcmd }}
      - {{ . | quote }}
      {{- end }}
      - touch /var/lib/cloud/instance/boot-finished

    final_message: "Cloud-init completed after $UPTIME seconds"
{{- end }}
