{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coolify-platform.fullname" . }}-installer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coolify-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: installer
  annotations:
    {{- include "coolify-platform.preInstallAnnotations" (dict "weight" "-10") | nindent 4 }}
---
{{- if .Values.rbac.createClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "coolify-platform.fullname" . }}-installer
  labels:
    {{- include "coolify-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: installer
  annotations:
    {{- include "coolify-platform.preInstallAnnotations" (dict "weight" "-10") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "secrets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["*"]
  - apiGroups: ["kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "coolify-platform.fullname" . }}-installer
  labels:
    {{- include "coolify-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: installer
  annotations:
    {{- include "coolify-platform.preInstallAnnotations" (dict "weight" "-10") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "coolify-platform.fullname" . }}-installer
subjects:
  - kind: ServiceAccount
    name: {{ include "coolify-platform.fullname" . }}-installer
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
