# Coolify Platform - OKD LVM Local Deployment
# Domain: apps.okd.lvm.local

platform:
  type: "okd"

# KubeVirt - moet geïnstalleerd worden
kubevirt:
  install: true
  version: "v1.4.0"
  cdiVersion: "v1.60.3"
  useEmulation: false

# Docker Host VMs
dockerHosts:
  enabled: true
  count: 2
  namespace: "coolify-vms"

  resources:
    cores: 4
    memory: "8Gi"
    diskSize: "100Gi"

  image:
    source: "quay.io/containerdisks/fedora:40"
    pullPolicy: IfNotPresent

  storage:
    storageClass: "ceph-rbd"
    accessMode: "ReadWriteOnce"
    volumeMode: "Block"

  ssh:
    generateKeys: false  # We provide our own keys
    port: 22
    username: "coolify"
    # SSH public keys for access
    authorizedKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAUpqestoDiLYcl0DLcRhPEpH03fDKEOlDkey3UZLoSN leonmeijer@github"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILy0Qw7R2Q8BxUtNL6QG3XMEn4HZi9P97vOpI9M9UQ9z leonmeijer@github"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEv93KejieEEFZRir5nsuLI+v1BxV2feLFrVeVu5+acj leonmeijer@github"
      - "ssh-rsa  leon@Mac.thuis.local"

  cloudInit:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - curl
      - git
      - vim
      - htop
      - tmux

  health:
    enabled: true
    schedule: "*/5 * * * *"
    image:
      repository: nexus.lvm.local:8082/bitnami/kubectl
      tag: "1.31"
      pullPolicy: IfNotPresent

  registration:
    enabled: true
    waitForCoolify: true
    image:
      repository: nexus.lvm.local:8082/curlimages/curl
      tag: "8.5.0"
      pullPolicy: IfNotPresent

# Coolify subchart
coolify:
  enabled: true

  initContainer:
    image:
      repository: nexus.lvm.local:8082/library/busybox
      tag: "1.36"

  coolify:
    image:
      repository: nexus.lvm.local:8082/coollabsio/coolify
      tag: "latest"
    config:
      appUrl: "https://coolify.apps.okd.lvm.local"
      appEnv: "production"
      appDebug: false

  soketi:
    image:
      repository: nexus.lvm.local:8082/coollabsio/coolify-realtime
      tag: "1.0.10"

  postgresql:
    enabled: true
    image:
      repository: nexus.lvm.local:8082/library/postgres
      tag: "15-alpine"
    persistence:
      enabled: true
      storageClass: "ceph-rbd"
      size: 10Gi

  redis:
    enabled: true
    image:
      repository: nexus.lvm.local:8082/library/redis
      tag: "7-alpine"
    persistence:
      enabled: true
      storageClass: "ceph-rbd"
      size: 2Gi

  persistence:
    enabled: true
    storageClass: "ceph-rbd"
    size: 50Gi

  # Disable Ingress, use Routes
  ingress:
    enabled: false

  # OpenShift Routes
  route:
    enabled: true
    host: "coolify.apps.okd.lvm.local"
    tls:
      enabled: true
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"

  soketiRoute:
    enabled: true
    host: "soketi.apps.okd.lvm.local"
    tls:
      enabled: true
      termination: "edge"

  openshift:
    createSCC: true

  serviceAccount:
    create: true

  security:
    podSecurityContext: {}
    securityContext: {}

# Network policies
networkPolicy:
  enabled: true
  allowCoolifyAccess: true
  coolifyNamespace: "coolify"

# RBAC
rbac:
  create: true
  createClusterRole: true
