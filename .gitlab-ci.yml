stages:
  - build
  - deploy

variables:
  QUAY_REGISTRY: "quay.lvm.local"
  QUAY_IMAGE: "quay.lvm.local/${QUAY_NAMESPACE}/coolify"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  # Buildah storage
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  BUILDAH_ISOLATION: chroot

# Build and push Docker image
build:
  stage: build
  image: ${NEXUS_REGISTRY}/buildah/stable
  tags:
    - docker
  variables:
    NEXUS_REGISTRY: nexus.lvm.local:8082
  before_script:
    # Create authfile for buildah
    - mkdir -p $HOME/.config/containers
    - |
      cat > $HOME/.config/containers/auth.json << EOF
      {
        "auths": {
          "quay.lvm.local": {
            "auth": "$(echo -n "${QUAY_USERNAME}:${QUAY_PASSWORD}" | base64)"
          },
          "nexus.lvm.local:8082": {
            "auth": "$(echo -n "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" | base64)"
          }
        }
      }
      EOF
    # Login to Quay for push
    - buildah login --authfile $HOME/.config/containers/auth.json -u "${QUAY_USERNAME}" -p "${QUAY_PASSWORD}" "quay.lvm.local"
    # Login to Nexus for pulling base images
    - buildah login --authfile $HOME/.config/containers/auth.json -u "${NEXUS_USERNAME}" -p "${NEXUS_PASSWORD}" "nexus.lvm.local:8082"
    # Create registries.conf to route pulls through Nexus
    - |
      mkdir -p $HOME/.config/containers
      cat > $HOME/.config/containers/registries.conf << 'EOF'
      unqualified-search-registries = ["docker.io"]

      [[registry]]
      prefix = "docker.io"
      location = "nexus.lvm.local:8082"
      insecure = true

      [[registry]]
      prefix = "serversideup"
      location = "nexus.lvm.local:8082/serversideup"
      insecure = true

      [[registry]]
      prefix = "minio"
      location = "nexus.lvm.local:8082/minio"
      insecure = true

      [[registry]]
      prefix = "quay.lvm.local"
      location = "quay.lvm.local"
      insecure = true
      EOF
    - export REGISTRIES_CONFIG_PATH=$HOME/.config/containers/registries.conf
  script:
    - |
      buildah bud \
        --registries-conf $HOME/.config/containers/registries.conf \
        --format docker \
        --layers \
        -t ${QUAY_IMAGE}:${IMAGE_TAG} \
        -t ${QUAY_IMAGE}:${CI_COMMIT_REF_SLUG} \
        -t ${QUAY_IMAGE}:latest \
        -f docker/production/Dockerfile \
        .
    - buildah push --authfile $HOME/.config/containers/auth.json --tls-verify=false ${QUAY_IMAGE}:${IMAGE_TAG}
    - buildah push --authfile $HOME/.config/containers/auth.json --tls-verify=false ${QUAY_IMAGE}:${CI_COMMIT_REF_SLUG}
    - buildah push --authfile $HOME/.config/containers/auth.json --tls-verify=false ${QUAY_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "okd"

# Deploy to OKD
deploy:
  stage: deploy
  image: ${NEXUS_REGISTRY}/openshift/origin-cli:4.14
  tags:
    - docker
  variables:
    NEXUS_REGISTRY: nexus.lvm.local:8082
  before_script:
    - oc login --token=${OKD_TOKEN} --server=${OKD_SERVER} --insecure-skip-tls-verify=true
  script:
    - |
      # Update the deployment with the new image
      oc set image deployment/coolify-platform \
        coolify=${QUAY_IMAGE}:${IMAGE_TAG} \
        -n coolify

      # Wait for rollout
      oc rollout status deployment/coolify-platform -n coolify --timeout=300s

      echo "Deployed ${QUAY_IMAGE}:${IMAGE_TAG} to OKD"
  rules:
    - if: $CI_COMMIT_BRANCH == "okd"
  needs:
    - build
